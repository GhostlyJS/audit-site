services:
  app:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      APP_PORT: "3000"
    volumes:
      - data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-8095}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
